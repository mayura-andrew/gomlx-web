<nav class="site-nav" id="site-nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo" aria-label="GoMLX home">
      <img src="/img/logo.jpeg" class="logo-mark" alt="GoMLX logo" width="28" height="28" style="border-radius: 7px; object-fit: cover;">
      <span class="nav-wordmark">GoMLX</span>
      <span class="nav-version" id="gomlx-version" title="Latest Release">{{ .Site.Params.version }}</span>
    </a>

    <ul class="nav-links" role="list">
      {{ range .Site.Menus.main }}
      <li>
        <a href="{{ .URL }}" class="nav-link{{ if $.IsMenuCurrent "main" . }} is-active{{ end }}">
          {{ .Name }}
        </a>
      </li>
      {{ end }}
    </ul>

    <div class="nav-actions">
      <button class="nav-search-trigger" id="search-trigger" aria-label="Search">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="4" stroke="currentColor" stroke-width="1.5"/><path d="M10 10L13.5 13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>Search</span>
        <kbd>⌘K</kbd>
      </button>

      <a href="{{ .Site.Params.github }}" class="nav-github" target="_blank" rel="noopener" aria-label="GitHub" style="display: inline-flex; align-items: center; text-decoration: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
        <span id="nav-github-stars" style="margin-left: 6px; font-size: 0.825rem; font-weight: 600;"></span>
      </a>

      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13.5 9.5A6 6 0 016.5 2.5a6.002 6.002 0 000 11A6 6 0 0013.5 9.5z" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>

      <button class="nav-hamburger" id="nav-hamburger" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>

<script>
  // Dynamically fetch GitHub repository stats and latest release
  (function() {
    const repoUrl = 'https://api.github.com/repos/gomlx/gomlx';
    const formatNum = num => num >= 1000 ? (num / 1000).toFixed(1) + 'k' : num;

    // Fetch Repository Stats (Stars, Forks)
    fetch(repoUrl)
      .then(res => res.json())
      .then(data => {
        if (data.stargazers_count !== undefined) {
          const starsText = formatNum(data.stargazers_count);
          const navStars = document.getElementById('nav-github-stars');
          const stripStars = document.getElementById('strip-github-stars');
          if (navStars) navStars.textContent = starsText;
          if (stripStars) stripStars.textContent = starsText;
        }
        if (data.forks_count !== undefined) {
          const stripForks = document.getElementById('strip-github-forks');
          if (stripForks) stripForks.textContent = formatNum(data.forks_count);
        }
      }).catch(err => console.debug('Could not fetch repo stats:', err));

    // Fetch Latest Release Version
    fetch(repoUrl + '/releases/latest')
      .then(res => res.json())
      .then(data => {
        if (data.tag_name) {
          const navVersion = document.getElementById('gomlx-version');
          const stripVersion = document.getElementById('strip-gomlx-version');
          if (navVersion) navVersion.textContent = data.tag_name;
          if (stripVersion) stripVersion.textContent = data.tag_name;
        }
      }).catch(err => console.debug('Could not fetch latest release:', err));
  })();
</script>
