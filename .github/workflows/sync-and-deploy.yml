name: Sync docs & deploy

on:
  # Re-sync whenever the upstream GoMLX repo pushes a new release
  schedule:
    - cron: '0 4 * * *'   # every day at 04:00 UTC
  # Also run on every push to this repo
  push:
    branches: [main]
  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      ref:
        description: 'GoMLX branch/tag to sync from (default: main)'
        required: false
        default: 'main'

permissions:
  contents: write   # needed to commit synced docs back to this repo
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Checkout this docs site repo ──────────────────────────────────
      - name: Checkout docs site
        uses: actions/checkout@v4

      # ── 2. Install Hugo ───────────────────────────────────────────────────
      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # ── 3. Sync markdown from GoMLX upstream ─────────────────────────────
      - name: Sync docs from gomlx/gomlx
        env:
          GOMLX_REF: ${{ github.event.inputs.ref || 'main' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/sync-docs.sh
          ./scripts/sync-docs.sh "$GOMLX_REF"

      # ── 4. Commit synced content back (so history is trackable) ──────────
      - name: Commit synced docs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/docs/
          git diff --cached --quiet || git commit -m "chore: sync docs from gomlx/gomlx@$(date +%Y-%m-%d)"
          git push || true   # don't fail if nothing changed

      # ── 5. Build Hugo site ────────────────────────────────────────────────
      - name: Build Hugo site
        run: hugo --minify

      # ── 6. Deploy to GitHub Pages ─────────────────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
